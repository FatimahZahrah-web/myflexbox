<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | Results summary componet</title>
    <link rel="stylesheet" href="./style.css"/>
    <link rel="preconnect" href="https://fonts.googleleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic,com"/>
 <link rel="preconnect" href="./results-summary-component-main/assets/fonts/HankenGrotesk-VariableFont_wght.ttf"/>
</head>
<body>
    <div class="parent-item">
        <div class="item-L">
        <h2>Your result</h2> 
         <div class="circle">
           <h4>76</h4>
            <p>of 100</p> 
         </div>
         <div>
            <h1>Great</h1>
         </div>
         <div class="test">
            you secured higher than 65% of the people who have taken this tests. 
         </div>
        </div>
         <div class="item-R">
            <div class="summary" >
                <h3>summary</h3>
            </div>
                <div class="reaction-image">
                    <div class="RI">
                    <img src="./results-summary-component-main/assets/images/icon-reaction.svg"/>
                    <span class="reaction">Reaction</span>
                </div>
                    <div class="eig">80<span class="percentage">/100</span></div>
                
                </div>
                 <div class="memory-image">
                    <div class="MI">
                        <img src="./results-summary-component-main/assets/images/icon-memory.svg"/>
                          <span class="Memory">Memory</span>
                    </div>
                        <div class="nin">92<span class="grade">/100</span></div>
                 </div>
                    <div class="verbal-image">
                        <div class="VI">
                            <img src="./results-summary-component-main/assets/images/icon-verbal.svg"/>
                            <span class="Verbal">Verbal</span>
                        </div>
                            <div class="six">61<span class="average">/100</div>  
                    </div>  
                    <div class="visual-image">
                        <div class="VI2">
                            <img src="./results-summary-component-main/assets/images/icon-visual.svg"/>
                            <span class="visual">Visual</span>
                        </div>
                        <div class="seven">73<span class=" fair">/100</span></div>
                    </div>
                    <div class="continue">
                       <div class="CT"> Continue </div>
                      </div>
             </div>
       </div>
    </div> 
    <div class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
        Coded by <a href="#">Muhammed Fatimat-Zaharah Oyiza</a>.    
</body>
</html>
